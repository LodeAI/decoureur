<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina niet gevonden — De Coureur</title>

<!-- **GitHub Pages serveert dit bestand bij elk onbekend adres**, met een echte
     404-status. Zonder dit bestand krijgt de bezoeker de generieke foutpagina van
     GitHub, met hun logo en zonder een weg terug.

     `noindex` is hier geen voorzorg maar noodzaak: een 404 die er als een gewone
     pagina uitziet, is precies hoe een zoekmachine een "soft 404" gaat zien en
     dan alsnog indexeert. -->
<meta name="robots" content="noindex, follow">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="stijl.css">
</head>
<body>

<header class="kop">
  <a class="merk" href="./">
    <img class="logo" src="logo.svg" alt="" width="52" height="52">
    <span class="woordmerk">De Coureur</span>
  </a>
</header>

<main class="omhulsel">
  <h1>Deze pagina bestaat niet</h1>
  <p>Het adres klopt niet meer, of het heeft nooit bestaan.</p>
  <p><a href="./">Terug naar de start</a></p>
</main>

<footer class="omhulsel">
  <p class="voet-klein">Een spel over wielrennen. Niet verbonden aan de UCI, aan een ploeg of aan een organisator.</p>
  <hr class="voet-streep">
  <nav>
    <a href="uitleg/">Hoe werkt het</a>
    <a href="nieuwsbrief/">Nieuwsbrief</a>
    <a href="privacy/">Privacy</a>
    <a href="voorwaarden/">Voorwaarden</a>
    <a href="contact/">Contact</a>
  </nav>
</footer>

</body>
</html>
